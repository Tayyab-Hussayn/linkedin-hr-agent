name: Build & Release Qalam

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false   # if Windows fails, Linux still finishes (and vice versa)
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm

          - platform: windows-latest
            bundles: nsis

          - platform: macos-latest       # Apple Silicon (M1/M2/M3)
            bundles: dmg
            target: aarch64-apple-darwin

          - platform: macos-13           # Intel
            bundles: dmg
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Build qalam-worker sidecar ───────────────────────────────
      # Must happen before Tauri build — binary must exist in src-tauri/binaries/

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build qalam-worker sidecar (Linux)
        if: runner.os == 'Linux'
        working-directory: playwright
        run: |
          pip install pyinstaller requests urllib3 certifi charset-normalizer idna
          pyinstaller --onefile --name qalam-worker \
            --hidden-import zoneinfo \
            --hidden-import requests \
            --hidden-import urllib3 \
            --hidden-import charset_normalizer \
            --hidden-import certifi \
            --hidden-import idna \
            --collect-all requests \
            queue_worker_v5.py
          cp dist/qalam-worker ../src-tauri/binaries/qalam-worker-x86_64-unknown-linux-gnu

      - name: Build qalam-worker sidecar (Windows)
        if: runner.os == 'Windows'
        working-directory: playwright
        shell: pwsh
        run: |
          pip install pyinstaller requests urllib3 certifi charset-normalizer idna
          pyinstaller --onefile --name qalam-worker `
            --hidden-import zoneinfo `
            --hidden-import requests `
            --hidden-import urllib3 `
            --hidden-import charset_normalizer `
            --hidden-import certifi `
            --hidden-import idna `
            --collect-all requests `
            queue_worker_v5.py
          Copy-Item dist\qalam-worker.exe ..\src-tauri\binaries\qalam-worker-x86_64-pc-windows-msvc.exe

      - name: Build qalam-worker sidecar (macOS)
        if: runner.os == 'macOS'
        working-directory: playwright
        run: |
          pip install pyinstaller requests urllib3 certifi charset-normalizer idna
          pyinstaller --onefile --name qalam-worker \
            --hidden-import zoneinfo \
            --hidden-import requests \
            --hidden-import urllib3 \
            --hidden-import charset_normalizer \
            --hidden-import certifi \
            --hidden-import idna \
            --collect-all requests \
            queue_worker_v5.py
          TARGET=$(rustc -vV | grep host | awk '{print $2}')
          cp dist/qalam-worker ../src-tauri/binaries/qalam-worker-$TARGET

      # ── Rust & Node setup ────────────────────────────────────────

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      # ── Platform-specific system dependencies ────────────────────

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # ── Frontend build ───────────────────────────────────────────
      # tauri.conf.json beforeBuildCommand runs "cd ../dashboard && npm run build"
      # so we just need deps installed — the Next.js build runs automatically

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # ── Tauri build & GitHub Release upload ──────────────────────

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Qalam ${{ github.ref_name }}'
          releaseBody: |
            ## Qalam ${{ github.ref_name }}

            | Platform | File | Notes |
            |----------|------|-------|
            | Linux (Debian/Ubuntu) | `.deb` | Recommended for Ubuntu, Pop!_OS, Mint |
            | Linux (Fedora/RHEL/Arch) | `.rpm` | Recommended for Fedora, openSUSE |
            | Windows 10/11 | `.exe` | NSIS installer |

            **Full changelog:** https://byqalam.com/changelog
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}
